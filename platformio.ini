[platformio]
default_envs = mpk4

[env:mpk4]
platform = https://github.com/ArteryTek/platform-arterytekat32.git#7313140183db3ca5e74e723c2abcc4da82992dc5
platform_packages = platformio/toolchain-gccarmnoneeabi@1.120301.0
board = mpk_mini_iv
board_build.ldscript = ld/app.ld
extra_scripts =
    pre:scripts/build.py
    post:scripts/package.py
custom_firmware_version = 41.00
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/mpk4_flash.py" flash "$BUILD_DIR/mpk4_app_package.bin" --write
build_flags =
    -mfloat-abi=soft
